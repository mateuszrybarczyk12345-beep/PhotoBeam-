<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>PhotoBeam - Wyslij zdjecia</title>
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon.svg" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>📷 PhotoBeam</h1>
    <p>Wysylaj zdjecia i filmy z telefonu na komputer przez WiFi</p>
    <div id="conn-status" class="conn-status">
      <span id="conn-dot" class="conn-dot"></span>
      <span id="conn-text">Laczenie...</span>
    </div>
  </header>

  <main>
    <div id="status-banner"></div>

    <div class="actions">
      <button class="btn primary" id="pick-camera-btn" type="button">
        <span class="icon">📸</span>
        <span>Zdjecie</span>
      </button>
      <button class="btn" id="pick-video-btn" type="button">
        <span class="icon">🎥</span>
        <span>Nagraj film</span>
      </button>
      <button class="btn" id="pick-gallery-btn" type="button">
        <span class="icon">🖼️</span>
        <span>Z galerii</span>
      </button>
    </div>

    <input type="file" id="camera-input" accept="image/*" capture="environment" />
    <input type="file" id="video-input" accept="video/*" capture="environment" />
    <input type="file" id="gallery-input" accept="image/*,video/*" multiple />

    <div id="queue"></div>

    <div id="progress-wrap"><div id="progress-bar"></div></div>

    <button id="send-btn" type="button">Wyslij</button>
  </main>

  <footer>
    Zdjecia i filmy trafiaja bezposrednio na komputer w tej samej sieci WiFi.<br />
    Nic nie jest wysylane do internetu.
  </footer>

  <script src="/app.js"></script>
</body>
</html>
